# Local development. Run Django (runserver) and Vite natively; this file runs the services around
# them: Postgres, Redis, a Celery worker for on-demand syncs and the cron scheduler for the
# scheduled ones (deploy/crontab). Ports differ from the AT Tool's dev stack (5433/6380) so both can
# run at once.
#
# The worker and scheduler run the production image with backend/ mounted over /app, so they use the
# code on disk and the dev settings (backend/.env, same secret key as runserver, so stored ESI
# tokens decrypt). The worker restarts when a Python file changes; the scheduler starts a fresh
# process per job. After changing backend dependencies: `docker compose -f deploy/docker-compose.dev.yml
# up -d --build`.
name: eveindy-dev

x-backend: &backend
  image: eveindy-backend:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  restart: unless-stopped
  # Your user, so files written into backend/ (SDE downloads in backend/instance) are not root's.
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://eveindy:eveindy@db:5432/eveindy
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ../backend:/app
    - ../deploy:/app/deploy:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: eveindy
      POSTGRES_USER: eveindy
      POSTGRES_PASSWORD: eveindy
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveindy -d eveindy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  worker:
    <<: *backend
    # watchfiles (installed with uvicorn[standard]) restarts the worker when backend code changes.
    command:
      - watchfiles
      - --filter
      - python
      - celery -A config worker --loglevel=INFO --concurrency=2
      - /app

  scheduler:
    <<: *backend
    # Only one service builds the image: two building it at once collide.
    build: !reset null
    command: ["/app/deploy/entrypoint.sh", "scheduler"]

volumes:
  pgdata_dev:
