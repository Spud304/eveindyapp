# Production stack: Caddy (frontend + TLS, proxies the backend paths to `web`), the Django app,
# a Celery worker for on-demand syncs, the cron scheduler, Postgres and Redis.
# Settings: deploy/.env (see .env.example).
name: eveindy

# web, worker and scheduler run one image. Only `web` builds it: three services building the same
# image at once collide (containerd "parent snapshot does not exist" while exporting).
x-backend: &backend
  image: eveindy-backend:${APP_VERSION:-dev}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://eveindy:${POSTGRES_PASSWORD}@db:5432/eveindy
    REDIS_URL: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - instance:/app/instance

services:
  caddy:
    image: eveindy-frontend:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Let's Encrypt account email (expiry notices). Caddy will not start without one.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["/app/deploy/entrypoint.sh", "web"]
    # Reached through Caddy; published on loopback only for debugging on the host.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    <<: *backend
    command: ["/app/deploy/entrypoint.sh", "worker"]
    depends_on:
      web:
        condition: service_healthy  # migrations done

  scheduler:
    <<: *backend
    command: ["/app/deploy/entrypoint.sh", "scheduler"]
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eveindy
      POSTGRES_USER: eveindy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveindy -d eveindy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-lru: only keys with a TTL (the ESI ETag cache) are evicted; Celery's queue keys
    # have none, so queued syncs are never dropped.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", ""]

volumes:
  pgdata:
  instance:
  caddy_data:
  caddy_config:
