name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eveindy
          POSTGRES_USER: eveindy
          POSTGRES_PASSWORD: eveindy
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U eveindy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uvx ruff check
      - run: uvx ruff format --check
      # Browser tests (playwright_tests/) need both dev servers and the SDE; run them locally.
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The committed API types must match the backend's schema (npm run gen:api after a change).
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
        working-directory: backend
      - run: >-
          uv run python manage.py export_openapi_schema --api config.api.api
          --output "$RUNNER_TEMP/openapi.json"
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/schema.d.ts"
      - run: diff -u src/lib/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vite build
